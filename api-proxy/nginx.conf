# Puerta de entrada de api.mascotimes.com (n8n).
# Objetivo: que Google no indexe el servidor de automatizaciones.
# Todo lo que sale de aquí lleva "X-Robots-Tag: noindex, nofollow",
# salvo las fotos públicas de las noticias, que sí pueden salir en Google Imágenes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $robots_tag {
    default                    "noindex, nofollow";
    ~^/webhook/foto-publica    "";
}

server {
    listen 80;
    server_name _;

    # Sin registros de IP de visitas (misma política que la web)
    access_log off;

    client_max_body_size 50m;

    add_header X-Robots-Tag $robots_tag always;

    # DNS interno de Docker: nginx arranca aunque n8n tarde en levantarse
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $n8n http://n8n:5678;

    # robots.txt propio: antes devolvía la pantalla de inicio de n8n
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /webhook/foto-publica\nDisallow: /rest/\nDisallow: /signin\nDisallow: /home/\nDisallow: /workflow/\n";
    }

    location / {
        proxy_pass $n8n;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Editor de n8n en tiempo real (websocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # n8n ya manda su propia cabecera de robots en algunas rutas; dejamos solo la nuestra
        proxy_hide_header X-Robots-Tag;
    }
}
