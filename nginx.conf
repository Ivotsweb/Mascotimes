server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Privacidad: el contenedor de la web no guarda registros de visitas con IP
    access_log off;

    # DNS interno de Docker: resuelve en cada petición, así nginx arranca aunque la API no responda
    resolver 127.0.0.11 valid=60s ipv6=off;
    set $api https://api.mascotimes.com;

    # Página fija de cada noticia, generada por n8n para que Google lea el texto (7 nov 2026)
    location ~ "^/n/(?<nid>[A-Za-z0-9_.-]{1,80})/?$" {
        proxy_pass $api/webhook/pagina-mt?id=$nid;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mascotimes.com;
        proxy_intercept_errors on;
        error_page 502 503 504 = @noticia_js;
    }
    location @noticia_js { return 302 /noticia/?id=$nid; }

    # Sitemap con todas las noticias publicadas; si la API falla, el sitemap básico
    location = /sitemap.xml {
        proxy_pass $api/webhook/sitemap-mt;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mascotimes.com;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = /sitemap-base.xml;
    }

    location / { try_files $uri $uri/ =404; }
}
