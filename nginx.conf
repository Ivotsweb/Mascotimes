# www.mascotimes.com -> mascotimes.com (9 nov 2026)
# Secciones de noticias (26 nov 2026): /noticias/perros/, /gatos/, /espana/, /legales/
map $sec_slug $sec_nombre {
    default  "";
    perros   "Perros";
    gatos    "Gatos";
    espana   "España";
    legales  "Legales";
}
map $sec_slug $sec_titulo {
    default  "Noticias";
    perros   "Noticias de perros";
    gatos    "Noticias de gatos";
    espana   "Noticias de mascotas en España";
    legales  "Leyes y normas de mascotas en España";
}
map $sec_slug $sec_desc {
    default  "";
    perros   "Noticias de perros: educación, salud, razas, estudios y vida diaria con tu perro, con su fuente enlazada.";
    gatos    "Noticias de gatos: comportamiento, salud, estudios y vida en casa con tu gato, con su fuente enlazada.";
    espana   "Lo que pasa con perros y gatos en España, contado con rigor y con la fuente enlazada.";
    legales  "Leyes y normas sobre perros y gatos en España explicadas sin tecnicismos, con la norma oficial enlazada. Información orientativa.";
}

server {
    listen 80;
    server_name www.mascotimes.com;
    access_log off;
    return 301 https://mascotimes.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Privacidad: el contenedor de la web no guarda registros de visitas con IP
    access_log off;

    # DNS interno de Docker: resuelve en cada petición, así nginx arranca aunque la API no responda
    resolver 127.0.0.11 valid=60s ipv6=off;
    set $api https://api.mascotimes.com;

    # Página fija de cada noticia, generada por n8n para que Google lea el texto (7 nov 2026)
    # Desde el 26 nov 2026 la dirección lleva palabras: /n/<id>/<titular-en-palabras>/
    # Si llega sin palabras (o con unas antiguas), n8n responde 301 a la dirección buena.
    location ~ "^/n/(?<nid>[A-Za-z0-9_.-]{1,80})(?:/(?<nslug>[a-z0-9-]{1,120}))?/?$" {
        proxy_pass $api/webhook/pagina-mt?id=$nid&s=$nslug&v=3;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mascotimes.com;
        # La API lleva noindex; las páginas de noticia de mascotimes.com sí deben indexarse
        proxy_hide_header X-Robots-Tag;
        proxy_intercept_errors on;
        error_page 502 503 504 = @noticia_js;
    }
    location @noticia_js { return 302 /noticia/?id=$nid; }

    # Sitemap con todas las noticias publicadas; si la API falla, el sitemap básico
    location = /sitemap.xml {
        proxy_pass $api/webhook/sitemap-mt?v=2;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mascotimes.com;
        proxy_hide_header X-Robots-Tag;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = /sitemap-base.xml;
    }

    # Lista de noticias ya escrita en el HTML de la portada y de /noticias/ (26 nov 2026),
    # para que Google encuentre los enlaces sin ejecutar JavaScript. Si la API falla, no se inserta nada.
    location = /_ssr/enlaces {
        internal;
        proxy_pass $api/webhook/enlaces-mt?v=2&sec=$arg_sec;
        proxy_ssl_server_name on;
        proxy_set_header Host api.mascotimes.com;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header X-Robots-Tag;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Páginas de sección: una sola plantilla con su título, descripción y lista propia
    location ~ "^/noticias/(perros|gatos|espana|legales)/?$" {
        set $sec_slug $1;
        ssi on;
        ssi_silent_errors on;
        try_files /_plantillas/seccion.html =404;
    }
    location ^~ /_plantillas/ { return 404; }

    location / {
        ssi on;
        ssi_silent_errors on;
        try_files $uri $uri/ =404;
    }
}
